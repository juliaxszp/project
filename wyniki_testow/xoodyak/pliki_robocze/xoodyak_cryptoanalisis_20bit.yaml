name: Xoodyak SAT cryptanalysis v2

on:
  workflow_dispatch:

jobs:
  cryptoanalysis:
    name: ${{ matrix.solver }}-${{ matrix.unknown_bits }}bit-instance${{ matrix.instance }}

    runs-on: ubuntu-latest

    timeout-minutes: 358

    strategy:
      fail-fast: false
      max-parallel: 16

      matrix:
        include:
          - solver: Kissat404
            unknown_bits: 20
            instance: 1
          - solver: Kissat404
            unknown_bits: 20
            instance: 2

          - solver: CryptoMinisat
            unknown_bits: 20
            instance: 1
          - solver: CryptoMinisat
            unknown_bits: 20
            instance: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: Adam

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install SAT solvers
        run: |
          sudo apt-get update
          sudo apt-get install -y cryptominisat build-essential git

          git clone https://github.com/arminbiere/kissat.git
          cd kissat
          ./configure
          make -j$(nproc)
          sudo cp build/kissat /usr/local/bin/kissat
          cd ..

          echo "Checking installed solvers:"
          which kissat
          kissat --version
          which cryptominisat5
          cryptominisat5 --version

      - name: Run cryptanalysis
        run: |
          python -m src.xoodyak_cryptoanalisis_iterr2 \
            --solver "${{ matrix.solver }}" \
            --unknown-key-bits "${{ matrix.unknown_bits }}" \
            --instance "${{ matrix.instance }}"

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.solver }}-${{ matrix.unknown_bits }}-${{ matrix.instance }}
          path: wyniki_${{ matrix.solver }}_${{ matrix.unknown_bits }}_${{ matrix.instance }}.json
          if-no-files-found: warn
          retention-days: 30